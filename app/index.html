<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0C0B22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="styles.css">

<body>
<div class="app">
  <header class="top">
    <button class="back" id="back" aria-label="Retour" hidden>&larr;</button>
    <div class="mark"><b>C<i>O</i>SMO</b><small>Kourou · Guyane</small></div>
    <div class="spacer"></div>
    <button class="reset" id="reset" hidden>Accueil</button>
    <button class="newc" id="newBtn" hidden></button>
    <button class="calcbtn" id="calcBtn" aria-label="Calculatrice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="5" width="10" height="4" rx="1" fill="currentColor"/><circle cx="8.5" cy="13" r="1.3" fill="currentColor"/><circle cx="12" cy="13" r="1.3" fill="currentColor"/><circle cx="15.5" cy="13" r="1.3" fill="currentColor"/><circle cx="8.5" cy="17.5" r="1.3" fill="currentColor"/><circle cx="12" cy="17.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="17.5" r="1.3" fill="currentColor"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<div class="bar"><button id="bar"></button></div>
<div class="toast" id="toast"></div>
<div class="show" id="show" hidden></div>
<div class="calc" id="calc" role="dialog" aria-modal="true" aria-labelledby="calcH" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Réglages" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
